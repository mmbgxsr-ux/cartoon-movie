name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]            # الاختبارات تُوزَّع على 3 مهام متوازية (tests/conftest.py)
    env:
      TEST_SHARDS: 3
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build
        run: python build.py --no-min

      - name: Check index.html is up to date
        run: git diff --exit-code -- index.html

      - name: Run tests
        run: python -m pytest tests -v --tb=short --junitxml=report.xml

      - name: Report test failures as annotations
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse('report.xml').getroot()
          except Exception as e:
              print('::error title=no junit report::%s' % e); raise SystemExit
          n = 0
          for tc in root.iter('testcase'):
              for kind in ('failure', 'error'):
                  el = tc.find(kind)
                  if el is not None and n < 9:
                      n += 1
                      msg = (el.get('message') or '') + '\n' + (el.text or '')
                      msg = msg[-1200:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      print('::error title=%s::%s' % (tc.get('name'), msg))
          PY

      - name: Upload single-file build
        if: matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-movie-dist
          path: dist/*.html
